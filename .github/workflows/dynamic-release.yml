name: Dynamic Workflow - publish completed result
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-workflow:
    name: Verify the real captured Dynamic Workflow result
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate and render the actual locally completed result
        env:
          DEMO_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp evidence/dynamic-workflow-result.json workflow-result.json
          node scripts/render-workflow-result.mjs workflow-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actual-dynamic-workflow-result
          path: |
            workflow-result.json
            workflow-result.md
          if-no-files-found: error
  publish-result:
    name: Publish the verified result
    needs: run-workflow
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: actual-dynamic-workflow-result
      - name: Create the demo issue
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_REPOSITORY: ${{ github.repository }}
        run: |
          gh issue create --repo "$DEMO_REPOSITORY" \
            --title "[dynamic demo] READY - completed local workflow result" \
            --body-file workflow-result.md
          cat workflow-result.md >> "$GITHUB_STEP_SUMMARY"
